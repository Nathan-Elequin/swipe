<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Boss Rush — Content Board</title>
  <style>
    :root {
      --bg: #100e0c;
      --ink: #1c120c;
      --cream: #f3e6d0;
      --muted: #9a8b78;
      --gold: #c4a574;
      --atk: #c42c2c;
      --blk: #1a6a8c;
      --hp: #6b2218;
      --defeat: #6a2ea8;
      --live: #3d6b3d;
      --todo: #8a5a2b;
      --hold: #5c3d3d;
      --panel: #f3e6d0;
      --wood: #3a2a1c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font: 15px/1.4 Georgia, "Times New Roman", serif; }
    header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 16px; background: #14110f; border-bottom: 2px solid var(--gold);
    }
    header h1 { margin: 0; font-size: 20px; color: var(--gold); font-weight: 600; }
    header p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
    button, .btn {
      font: inherit; cursor: pointer; border-radius: 999px;
      border: 2px solid var(--gold); background: var(--wood); color: var(--cream);
      padding: 7px 14px;
    }
    button:hover { filter: brightness(1.15); }
    button.gold { background: #3a2820; color: var(--gold); }
    button.danger { border-color: var(--atk); }
    .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100% - 58px); }
    aside { border-right: 1px solid #3a322b; overflow: auto; padding: 12px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .tabs button.on { background: var(--gold); color: #1a1714; }
    input[type=search], input, select, textarea {
      width: 100%; font: inherit; background: #201c18; color: var(--cream);
      border: 1px solid #3a322b; border-radius: 6px; padding: 6px 8px;
    }
    textarea { min-height: 88px; resize: vertical; }
    textarea.flow { min-height: 140px; font-family: Consolas, "Courier New", monospace; font-size: 13px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .filters button { padding: 4px 10px; font-size: 13px; }
    .filters button.on { background: var(--gold); color: #1a1714; }
    .list { display: flex; flex-direction: column; gap: 6px; }
    .row {
      text-align: left; width: 100%; border-radius: 8px; padding: 8px 10px;
      border: 1px solid #3a322b; background: #1c1814;
    }
    .row.on { border-color: var(--gold); background: #2a2014; }
    .row .nm { font-size: 16px; }
    .row .meta { font-size: 12px; color: var(--muted); }
    .tag { display: inline-block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; margin-right: 4px; border: 1px solid currentColor; }
    .tag.live { color: #8dcb8d; }
    .tag.todo { color: #e0b07a; }
    .tag.hold { color: #d98a8a; }
    .tag.retired { color: #8a8178; }
    .tag.lock { color: #e07a7a; }
    .tag.atk { color: var(--atk); }
    .tag.hp { color: #e07a7a; }
    main { overflow: auto; padding: 16px 20px 48px; }
    .sheet {
      background: var(--panel); color: var(--ink); border-radius: 12px; padding: 18px;
      max-width: 860px; box-shadow: 0 10px 30px #0008;
    }
    .sheet h2 { margin: 0 0 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .sheet label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #6b4a10; margin: 8px 0 4px; }
    .sheet input, .sheet select, .sheet textarea { background: #fffaf2; color: var(--ink); border: 1px solid #c4a574; }
    .hint { font-size: 13px; color: #6b4a10; margin: 0 0 12px; }
    .empty { color: var(--muted); padding: 40px; }
    .dirty { color: #e8c36a; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Content Board</h1>
    <p>Edit items and monsters here. <b>Save into repo</b> writes <code>data/content-board.json</code> and locks the fields you changed so chat cannot rewrite them unless you override.</p>
    <span class="dirty" id="dirty" hidden>Unsaved</span>
    <button class="gold" id="btnSave">Save into repo</button>
    <button id="btnDl">Download JSON</button>
    <button id="btnLoad">Load file</button>
    <button id="btnAddM">+ Monster</button>
    <button id="btnAddI">+ Item</button>
  </header>
  <div class="layout">
    <aside>
      <div class="tabs">
        <button class="on" data-kind="monster" id="tabM">Monsters</button>
        <button data-kind="item" id="tabI">Items</button>
      </div>
      <input type="search" id="q" placeholder="Search name or id" />
      <div class="filters" id="stFilters">
        <button class="on" data-st="all">All</button>
        <button data-st="live">Live</button>
        <button data-st="todo">Todo</button>
        <button data-st="hold">Hold</button>
        <button data-st="retired">Retired</button>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <main id="main"><p class="empty">Pick a card, or add one.</p></main>
  </div>
  <input type="file" id="file" accept="application/json" hidden />
  <script src="content-board-seed.js"></script>
  <script>
    const KEY = "boss-rush-content-board";
    let board = window.CONTENT_BOARD || { monsters: [], items: [], updated: "" };
    let kind = "monster";
    let status = "all";
    let selected = null;
    let dirty = false;
    let fileHandle = null;
    let snapshot = {};
    const LOCK_FIELDS = ["name","ability","explainer","flow","notes","ops","rarity","tier","count","priority","atk_base","hp_base","atk_formula","hp_formula"];

    function fp(v) {
      if (v == null) return "";
      if (typeof v === "object") return JSON.stringify(v);
      return String(v);
    }
    function takeSnapshot() {
      snapshot = {};
      for (const k of ["monsters", "items"]) {
        for (const c of (board[k] || [])) {
          snapshot[`${c.kind || (k === "monsters" ? "monster" : "item")}:${c.id}`] = LOCK_FIELDS.reduce((o, f) => { o[f] = c[f]; return o; }, {});
        }
      }
    }
    function stampLocks() {
      const today = new Date().toISOString().slice(0, 10);
      for (const k of ["monsters", "items"]) {
        for (const c of (board[k] || [])) {
          const prev = snapshot[`${c.kind || (k === "monsters" ? "monster" : "item")}:${c.id}`] || {};
          const fields = Array.isArray(c.locked_fields) ? c.locked_fields.slice() : [];
          for (const f of LOCK_FIELDS) {
            if (fp(c[f]) !== fp(prev[f]) && !fields.includes(f)) fields.push(f);
          }
          if (fields.length || c.author_lock) {
            c.author_lock = true;
            c.locked_fields = fields.length ? fields : (c.locked_fields || LOCK_FIELDS.slice());
            c.locked_at = today;
          }
        }
      }
    }

    const $ = (id) => document.getElementById(id);
    function markDirty() { dirty = true; $("dirty").hidden = false; }
    function markClean() { dirty = false; $("dirty").hidden = true; }

    function list() { return kind === "monster" ? board.monsters : board.items; }
    function slug(s) {
      return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "new_card";
    }

    function renderList() {
      const q = $("q").value.trim().toLowerCase();
      const el = $("list");
      el.innerHTML = "";
      list().filter((c) => {
        if (status !== "all" && c.status !== status) return false;
        if (!q) return true;
        return (c.name + " " + c.id + " " + (c.ability || "")).toLowerCase().includes(q);
      }).forEach((c) => {
        const b = document.createElement("button");
        b.className = "row" + (selected && selected.id === c.id && selected.kind === c.kind ? " on" : "");
        b.innerHTML = `<div class="nm">${esc(c.name)}</div>
          <div class="meta"><span class="tag ${c.status}">${c.status}</span>
          ${c.author_lock ? `<span class="tag lock">locked</span>` : ""}
          ${c.kind === "monster" ? `<span class="tag atk">ATK ${c.atk_base ?? "—"}</span><span class="tag hp">HP ${c.hp_base ?? "—"}</span>` : ""}
          T${c.tier ?? "?"} · ${c.rarity || ""}</div>`;
        b.onclick = () => { selected = c; renderList(); renderEditor(); };
        el.appendChild(b);
      });
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    }

    function field(label, key, type) {
      const v = selected[key] ?? "";
      if (type === "textarea") {
        return `<label>${label}</label><textarea id="f_${key}">${esc(v)}</textarea>`;
      }
      if (type === "flow") {
        return `<label>${label}</label><textarea class="flow" id="f_${key}" placeholder="On Use:&#10;  deal ATK 2&#10;  then flip…">${esc(v)}</textarea>`;
      }
      if (type === "select") {
        const opts = key === "status"
          ? ["live", "todo", "hold", "retired"]
          : ["starter", "uncommon"];
        return `<label>${label}</label><select id="f_${key}">${opts.map((o) => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
      }
      return `<label>${label}</label><input id="f_${key}" value="${esc(v)}" />`;
    }

    function renderEditor() {
      const m = $("main");
      if (!selected) { m.innerHTML = `<p class="empty">Pick a card, or add one.</p>`; return; }
      const isM = selected.kind === "monster";
      m.innerHTML = `<div class="sheet">
        <h2>${esc(selected.name)}</h2>
        <p class="hint">${isM ? "Monster" : "Item"} · player-facing Ability is what shows in game. Flow is the pseudocode I implement from. Notes are for me when something’s weird. Save locks changed fields so chat cannot rewrite them unless you override.${selected.author_lock ? " This card is already locked." : ""}</p>
        <div class="grid2">
          ${field("Name", "name")}
          ${field("Id", "id")}
        </div>
        <div class="grid3">
          ${field("Status", "status", "select")}
          ${field("Rarity", "rarity", "select")}
          ${field("Tier", "tier")}
        </div>
        <div class="grid3">
          ${field("Count", "count")}
          ${field("Priority", "priority")}
          ${isM ? field("ATK base", "atk_base") : field("Ops JSON", "ops_text")}
        </div>
        ${isM ? `<div class="grid2">${field("HP base", "hp_base")}${field("ATK formula", "atk_formula")}</div>
          ${field("HP formula", "hp_formula")}` : ""}
        ${field("Ability (player-facing)", "ability", "textarea")}
        ${field("Shift Text (the formula when holding Shift)", "explainer", "textarea")}
        ${field("Function flow / pseudocode", "flow", "flow")}
        ${field("Notes for the implementer", "notes", "textarea")}
        ${isM ? field("Ops JSON (optional)", "ops_text") : ""}
        <p class="hint" style="margin-top:14px">Status <b>todo</b> = I should build it when you say check for updates. <b>hold</b> = skip until you change it. <b>live</b> = already in the dungeon.</p>
        <button class="danger" id="btnDel">Delete this card</button>
      </div>`;
      selected.ops_text = JSON.stringify(selected.ops || {}, null, 2);
      const opsEl = document.getElementById("f_ops_text");
      if (opsEl) opsEl.value = selected.ops_text;
      m.querySelectorAll("input, select, textarea").forEach((el) => {
        el.addEventListener("input", () => bindField(el));
        el.addEventListener("change", () => bindField(el));
      });
      $("btnDel") && ($("btnDel").onclick = () => {
        const arr = list();
        const i = arr.findIndex((c) => c.id === selected.id);
        if (i >= 0) arr.splice(i, 1);
        selected = null;
        markDirty();
        renderList();
        renderEditor();
      });
    }

    function bindField(el) {
      const key = el.id.replace(/^f_/, "");
      let v = el.value;
      if (["tier", "count", "priority", "atk_base", "hp_base"].includes(key)) {
        v = v === "" ? null : Number(v);
      }
      if (key === "ops_text") {
        selected.ops_text = el.value;
        try { selected.ops = JSON.parse(el.value || "{}"); el.style.borderColor = "#c4a574"; }
        catch (e) { el.style.borderColor = "#c42c2c"; }
      } else {
        selected[key] = v;
      }
      if (key === "name" && selected.id && selected.id.startsWith("new_")) selected.id = slug(v);
      markDirty();
      renderList();
    }

    function addCard(k) {
      const c = {
        id: "new_" + Date.now(),
        name: k === "monster" ? "New Monster" : "New Item",
        kind: k,
        status: "todo",
        rarity: "starter",
        tier: 1,
        count: 1,
        priority: 3,
        atk_base: k === "monster" ? 3 : null,
        hp_base: k === "monster" ? 3 : null,
        atk_formula: "",
        hp_formula: "",
        ability: "",
        explainer: "",
        flow: "",
        notes: "",
        ops: {},
        contradiction_ids: []
      };
      (k === "monster" ? board.monsters : board.items).push(c);
      kind = k;
      selected = c;
      markDirty();
      document.getElementById("tabM").classList.toggle("on", k === "monster");
      document.getElementById("tabI").classList.toggle("on", k === "item");
      renderList();
      renderEditor();
    }

    function payload() {
      board.updated = new Date().toISOString().slice(0, 10);
      board.monsters.forEach((c) => { delete c.ops_text; });
      board.items.forEach((c) => { delete c.ops_text; });
      stampLocks();
      return JSON.stringify(board, null, 2);
    }

    async function saveRepo() {
      const text = payload();
      localStorage.setItem(KEY, text);
      if (window.showSaveFilePicker) {
        try {
          if (!fileHandle) {
            fileHandle = await showSaveFilePicker({
              suggestedName: "content-board.json",
              types: [{ description: "Content board", accept: { "application/json": [".json"] } }]
            });
          }
          const w = await fileHandle.createWritable();
          await w.write(text);
          await w.close();
          markClean();
          alert("Saved. Next: in chat, say “check for item updates”.");
          return;
        } catch (e) {
          if (e && e.name === "AbortError") return;
        }
      }
      download();
      markClean();
      alert("Downloaded content-board.json. Drop it on data/content-board.json in the repo, then tell chat to check.");
    }

    function download() {
      const blob = new Blob([payload()], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "content-board.json";
      a.click();
    }

    $("tabM").onclick = () => { kind = "monster"; $("tabM").classList.add("on"); $("tabI").classList.remove("on"); renderList(); };
    $("tabI").onclick = () => { kind = "item"; $("tabI").classList.add("on"); $("tabM").classList.remove("on"); renderList(); };
    $("stFilters").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      status = b.dataset.st;
      [...$("stFilters").children].forEach((x) => x.classList.toggle("on", x === b));
      renderList();
    };
    $("q").oninput = renderList;
    $("btnAddM").onclick = () => addCard("monster");
    $("btnAddI").onclick = () => addCard("item");
    $("btnSave").onclick = saveRepo;
    $("btnDl").onclick = download;
    $("btnLoad").onclick = () => $("file").click();
    $("file").onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      board = JSON.parse(await f.text());
      selected = null;
      takeSnapshot();
      markClean();
      renderList();
      renderEditor();
    };

    (async () => {
      const local = localStorage.getItem(KEY);
      if (local) {
        try { board = JSON.parse(local); } catch (e) {}
      } else {
        try {
          const r = await fetch("../data/content-board.json");
          if (r.ok) board = await r.json();
        } catch (e) {}
      }
      takeSnapshot();
      renderList();
    })();
  </script>
</body>
</html>
