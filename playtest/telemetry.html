<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playtest telemetry</title>
<style>
  :root { --bg:#1a1612; --ink:#f3e6c8; --muted:#b9a88a; --card:#241e18; --line:#3a322b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 Georgia, "Times New Roman", serif; background: var(--bg); color: var(--ink); }
  header, .pad { padding: 20px 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 10px; color: var(--muted); max-width: 54em; }
  .cfg { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  input { background: #2c251e; color: var(--ink); border: 1px solid var(--line); padding: 6px 8px; min-width: 16em; }
  button { background: #3a2e22; color: var(--ink); border: 1px solid #c4a574; padding: 6px 12px; cursor: pointer; }
  .status { color: #8dcb8d; min-height: 1.2em; }
  table { border-collapse: collapse; width: 100%; margin: 0 0 28px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  th { color: #e8c36a; font-weight: normal; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  h2 { font-size: 18px; margin: 24px 0 8px; color: #e8c36a; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0 20px; }
  .stat { background: var(--card); padding: 12px 16px; min-width: 8em; border: 1px solid var(--line); }
  .stat b { display: block; font-size: 22px; color: #e8c36a; }
</style>
</head>
<body>
<header>
  <h1>Playtest telemetry</h1>
  <p>Campaign dungeons only. Pick-two take rate, survive-with-item, claimed-on-win, monster presence vs survive — each compared inside its tier. Opening six are held, never picks. Rope home after a clear is still a dungeon win.</p>
  <div class="cfg">
    <input id="url" placeholder="https://swipe-playtest-inbox.vaelequin.workers.dev">
    <input id="token" placeholder="shared Send token" type="password">
    <label style="color:var(--muted);display:flex;align-items:center;gap:6px"><input id="test" type="checkbox" checked style="min-width:auto"> Include F5</label>
    <button id="load">Load live</button>
    <button id="example">Show worked example</button>
  </div>
  <p class="status" id="status"></p>
</header>
<div class="pad" id="board"></div>
<script>
const $ = (id) => document.getElementById(id);
$("url").value = localStorage.getItem("swipe_pt_url") || "https://swipe-playtest-inbox.vaelequin.workers.dev";
$("token").value = localStorage.getItem("swipe_pt_token") || "";
$("load").onclick = loadLive;
$("example").onclick = showExample;

const EXAMPLE = {
  counted: "made-up teaching set — not real players",
  sessions: 12,
  events: 90,
  counts: { dungeon_start: 20, dungeon_end: 20, draft_trial: 40, monster_seated: 24 },
  dungeons: { win: 12, dead: 8 },
  funnel: { hub_brand_new: 4, hub_middle: 3, hub_continue: 5, campaign: 10 },
  items: [
    { id: "healing_potion", tier: 1, offered: 18, taken: 15, pick_rate: 83.3, held: 16, held_win: 12, win_rate: 75, claimed: 11, claim_rate: 91.7 },
    { id: "net", tier: 1, offered: 14, taken: 9, pick_rate: 64.3, held: 10, held_win: 7, win_rate: 70, claimed: 6, claim_rate: 85.7 },
    { id: "da_boot", tier: 1, offered: 12, taken: 4, pick_rate: 33.3, held: 6, held_win: 3, win_rate: 50, claimed: 3, claim_rate: 100 },
    { id: "sledgehammer", tier: 2, offered: 8, taken: 7, pick_rate: 87.5, held: 7, held_win: 6, win_rate: 85.7, claimed: 5, claim_rate: 83.3 },
    { id: "hex", tier: 2, offered: 6, taken: 5, pick_rate: 83.3, held: 5, held_win: 4, win_rate: 80, claimed: 0, claim_rate: 0 },
    { id: "grimoire", tier: 3, offered: 4, taken: 2, pick_rate: 50, held: 3, held_win: 2, win_rate: 66.7, claimed: 2, claim_rate: 100 },
  ],
  monsters: [
    { id: "goblin", tier: 1, seated: 14, seated_win: 12, survive_rate: 85.7 },
    { id: "hornet", tier: 2, seated: 8, seated_win: 4, survive_rate: 50 },
    { id: "dragon", tier: 3, seated: 3, seated_win: 0, survive_rate: 0 },
  ],
};

function showExample() {
  render(EXAMPLE);
  $("status").textContent = "Worked example. This is invented so you can read the tables. Load live for the real database.";
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function table(title, rows, cols) {
  if (!rows || !rows.length) return `<h2>${esc(title)}</h2><p>None yet.</p>`;
  const head = cols.map((c) => `<th class="${c.num ? "num" : ""}">${esc(c.label)}</th>`).join("");
  const body = rows.map((r) => {
    const tds = cols.map((c) => {
      let v = r[c.key];
      if (v == null) v = "—";
      return `<td class="${c.num ? "num" : ""}">${esc(v)}</td>`;
    }).join("");
    return `<tr>${tds}</tr>`;
  }).join("");
  return `<h2>${esc(title)}</h2><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

async function loadLive() {
  const url = $("url").value.trim().replace(/\/$/, "");
  const token = $("token").value.trim();
  localStorage.setItem("swipe_pt_url", url);
  localStorage.setItem("swipe_pt_token", token);
  $("status").textContent = "Loading…";
  try {
    const test = $("test").checked ? "&test=1" : "";
    const res = await fetch(url + "?view=telemetry" + test, {
      headers: { "X-Swipe-Playtest": token },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    render(data);
    $("status").textContent = "Live. " + (data.counted || "");
  } catch (e) {
    $("status").textContent = "Could not load: " + e.message;
  }
}

function byTier(rows, tier) {
  return (rows || []).filter((r) => Number(r.tier) === tier);
}

function itemTables(rows) {
  const cols = [
    { key: "id", label: "Item" },
    { key: "offered", label: "Pick-two offered", num: true },
    { key: "taken", label: "Taken", num: true },
    { key: "pick_rate", label: "Take %", num: true },
    { key: "held", label: "Dungeons held", num: true },
    { key: "held_win", label: "Those survived", num: true },
    { key: "win_rate", label: "Survive % with it", num: true },
    { key: "claimed", label: "Still in hand on win", num: true },
    { key: "claim_rate", label: "Keep % on win", num: true },
  ];
  return [1, 2, 3].map((t) => table("Items · tier " + t, byTier(rows, t), cols)).join("");
}

function monsterTables(rows) {
  const cols = [
    { key: "id", label: "Monster" },
    { key: "seated", label: "Dungeons on the wheel", num: true },
    { key: "seated_win", label: "Those survived", num: true },
    { key: "survive_rate", label: "Survive %", num: true },
  ];
  return [1, 2, 3].map((t) => table("Monsters · tier " + t, byTier(rows, t), cols)).join("");
}

function render(data) {
  const dungeons = data.dungeons || data.runs || {};
  const funnel = Object.entries(data.funnel || {}).map(([step, n]) => ({ step, n }));
  const counts = Object.entries(data.counts || {}).map(([name, n]) => ({ name, n }));
  $("board").innerHTML = `
    <div class="cards">
      <div class="stat"><span>Sessions</span><b>${esc(data.sessions || 0)}</b></div>
      <div class="stat"><span>Events</span><b>${esc(data.events || 0)}</b></div>
      <div class="stat"><span>Dungeon wins</span><b>${esc(dungeons.win || 0)}</b></div>
      <div class="stat"><span>Dungeon deaths</span><b>${esc(dungeons.dead || 0)}</b></div>
    </div>
    ${itemTables(data.items)}
    ${monsterTables(data.monsters)}
    ${table("Funnel", funnel, [{ key: "step", label: "Step" }, { key: "n", label: "Count", num: true }])}
    ${table("Raw event counts", counts, [
      { key: "name", label: "Event" },
      { key: "n", label: "Count", num: true },
    ])}
  `;
}

showExample();
</script>
</body>
</html>
