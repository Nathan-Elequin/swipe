<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playtest telemetry</title>
<style>
  :root {
    --bg:#14110e; --ink:#f3e6c8; --muted:#9a8b74; --card:#1f1a16;
    --line:#3a322b; --gold:#e8c36a; --grey:#2a241c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.35 Georgia, "Times New Roman", serif; background: var(--bg); color: var(--ink); }
  header { padding: 14px 20px 8px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: normal; color: var(--gold); }
  .cfg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type="text"], input[type="password"] {
    background: #2c251e; color: var(--ink); border: 1px solid var(--line); padding: 5px 8px; min-width: 14em;
  }
  button, .tab {
    background: #3a2e22; color: var(--ink); border: 1px solid #c4a574; padding: 5px 12px; cursor: pointer; font: inherit;
  }
  .tab.on { background: #5a4630; color: #ffe3a5; }
  .status { color: #8dcb8d; min-height: 1.1em; margin: 8px 0 0; font-size: 13px; }
  label { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .tabs { display: flex; gap: 6px; padding: 10px 20px 0; }
  .hint { color: var(--muted); font-size: 13px; padding: 4px 20px 10px; }
  .board { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 8px 20px 28px; }
  .col { background: var(--card); border: 1px solid var(--line); min-height: 12em; }
  .col h2 { margin: 0; padding: 8px 10px; font-size: 14px; font-weight: normal; color: var(--gold); border-bottom: 1px solid var(--line); }
  .band { padding: 8px 8px 4px; color: var(--muted); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
  .rows { display: flex; flex-direction: column; gap: 6px; padding: 4px 10px 14px; }
  .row { display: grid; grid-template-columns: 36px 1fr 2.6em; gap: 8px; align-items: center; min-height: 36px; }
  .row img, .row .ph {
    width: 32px; height: 32px; image-rendering: pixelated; background: #100e0c; border: 1px solid #100e0c;
  }
  .row .ph { display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--muted); text-align: center; }
  .track { position: relative; height: 14px; background: #100e0c; border: 1px solid #3a322b; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; }
  .mean {
    position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1px dashed #e8c36a; opacity: 0.85; pointer-events: none;
  }
  .pct { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); text-align: right; }
  .tip {
    position: fixed; z-index: 20; max-width: 22em; padding: 8px 10px;
    background: #100e0c; border: 1px solid var(--gold); color: var(--ink);
    font-size: 13px; pointer-events: none; display: none;
  }
  .tip b { color: var(--gold); }
</style>
</head>
<body>
<header>
  <h1>Playtest board</h1>
  <div class="cfg">
    <input id="url" type="text" placeholder="https://swipe-playtest-inbox.vaelequin.workers.dev">
    <input id="token" type="password" placeholder="shared Send token">
    <label><input id="test" type="checkbox" checked> Include F5</label>
    <button id="load" type="button">Load live</button>
    <button id="example" type="button">Example</button>
  </div>
  <p class="status" id="status"></p>
</header>
<div class="tabs">
  <button type="button" class="tab on" data-sec="survive" title="Of dungeons that included this card, how often the player lived. Items and monsters. Compared only inside Weak, Tough, or Deadly.">Survive</button>
  <button type="button" class="tab" data-sec="popularity" title="When this item was one of two pick-two cards, how often they took it. Rerolls count as a miss. Opening six do not count.">Popularity</button>
  <button type="button" class="tab" data-sec="keep" title="Of wins where they had this item, how often it was still in a hotbar seat. Spent still counts.">Keep</button>
</div>
<p class="hint" id="hint"></p>
<div class="board" id="board"></div>
<div class="tip" id="tip"></div>
<script src="telemetry-art.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const ART = window.ART || {};
const N_MIN = 8;
const TIER_NAME = { 1: "Weak", 2: "Tough", 3: "Deadly" };
const HINT = {
  survive: "Survive — lived the dungeon. Grey until 8 samples in that tier. Red is worse for the player than the rest of this column.",
  popularity: "Popularity — took it from pick-two. Opening six are not here. Grey until 8 offers.",
  keep: "Keep — still in a hotbar seat when they won. Spent still counts. Grey until 8 wins with it.",
};
const TIPS = {
  survive_item: (r, v) => `<b>Survive ${fmt(v)}</b><br>Of dungeons where this was in the hand (opening six, a pick, or carried in), how often they lived. ${r.held || 0} dungeons, ${r.held_win || 0} lived.`,
  survive_mon: (r, v) => `<b>Survive ${fmt(v)}</b><br>Of dungeons where this sat on the wheel, how often they lived. ${r.seated || 0} dungeons, ${r.seated_win || 0} lived.`,
  popularity: (r, v) => `<b>Take ${fmt(v)}</b><br>When this was one of two pick-two cards, how often they took it. Rerolls count as a miss. ${r.taken || 0} of ${r.offered || 0} offers.`,
  keep: (r, v) => `<b>Keep ${fmt(v)}</b><br>Of wins where they had this, how often it was still in a hotbar seat (spent still counts). ${r.claimed || 0} of ${r.held_win || 0} wins.`,
};

$("url").value = localStorage.getItem("swipe_pt_url") || "https://swipe-playtest-inbox.vaelequin.workers.dev";
$("token").value = localStorage.getItem("swipe_pt_token") || "";
$("load").onclick = loadLive;
$("example").onclick = showExample;
document.querySelectorAll(".tab").forEach((b) => b.onclick = () => setSec(b.dataset.sec));

let DATA = null;
let SEC = "survive";

const EXAMPLE = {
  counted: "invented example",
  sessions: 12,
  events: 90,
  dungeons: { win: 14, dead: 8 },
  items: [
    { id: "healing_potion", tier: 1, offered: 18, taken: 15, pick_rate: 83.3, held: 16, held_win: 12, win_rate: 75, claimed: 11, claim_rate: 91.7 },
    { id: "net", tier: 1, offered: 14, taken: 9, pick_rate: 64.3, held: 12, held_win: 8, win_rate: 66.7, claimed: 7, claim_rate: 87.5 },
    { id: "da_boot", tier: 1, offered: 16, taken: 4, pick_rate: 25, held: 10, held_win: 4, win_rate: 40, claimed: 4, claim_rate: 100 },
    { id: "shield", tier: 1, offered: 12, taken: 8, pick_rate: 66.7, held: 11, held_win: 8, win_rate: 72.7, claimed: 8, claim_rate: 100 },
    { id: "sledgehammer", tier: 2, offered: 10, taken: 9, pick_rate: 90, held: 9, held_win: 8, win_rate: 88.9, claimed: 6, claim_rate: 75 },
    { id: "hex", tier: 2, offered: 9, taken: 7, pick_rate: 77.8, held: 9, held_win: 8, win_rate: 75, claimed: 0, claim_rate: 0 },
    { id: "longbow", tier: 2, offered: 8, taken: 5, pick_rate: 62.5, held: 8, held_win: 5, win_rate: 62.5, claimed: 5, claim_rate: 100 },
    { id: "grimoire", tier: 3, offered: 8, taken: 3, pick_rate: 37.5, held: 8, held_win: 4, win_rate: 50, claimed: 4, claim_rate: 100 },
    { id: "napalm", tier: 3, offered: 8, taken: 7, pick_rate: 87.5, held: 8, held_win: 7, win_rate: 87.5, claimed: 6, claim_rate: 85.7 },
  ],
  monsters: [
    { id: "goblin", tier: 1, seated: 14, seated_win: 12, survive_rate: 85.7 },
    { id: "skeleton", tier: 1, seated: 10, seated_win: 7, survive_rate: 70 },
    { id: "hornet_swarm", tier: 2, seated: 9, seated_win: 4, survive_rate: 44.4 },
    { id: "golem", tier: 2, seated: 8, seated_win: 5, survive_rate: 62.5 },
    { id: "dragon", tier: 3, seated: 8, seated_win: 1, survive_rate: 12.5 },
    { id: "lich", tier: 3, seated: 8, seated_win: 4, survive_rate: 50 },
  ],
};

function fmt(v) {
  if (v == null || Number.isNaN(v)) return "—";
  return Math.round(v) + "%";
}

function mean(nums) {
  if (!nums.length) return 0;
  return nums.reduce((a, b) => a + b, 0) / nums.length;
}

function sd(nums, m) {
  if (nums.length < 2) return 12;
  const v = nums.reduce((a, b) => a + (b - m) * (b - m), 0) / nums.length;
  return Math.max(8, Math.sqrt(v));
}

function heatColor(value, m, spread, enough) {
  if (!enough || value == null) return "var(--grey)";
  const t = Math.max(-1, Math.min(1, (value - m) / spread));
  const red = [160, 64, 48];
  const mid = [42, 36, 28];
  const green = [56, 140, 78];
  const from = t < 0 ? red : mid;
  const to = t < 0 ? mid : green;
  const u = t < 0 ? t + 1 : t;
  const mix = (a, b) => Math.round(a + (b - a) * u);
  return `rgb(${mix(from[0], to[0])},${mix(from[1], to[1])},${mix(from[2], to[2])})`;
}

function setSec(sec) {
  SEC = sec;
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.sec === sec));
  $("hint").textContent = HINT[sec] || "";
  if (DATA) draw();
}

function metric(row, kind) {
  if (SEC === "survive") {
    const v = kind === "monster" ? row.survive_rate : row.win_rate;
    const n = kind === "monster" ? row.seated : row.held;
    return { value: v, n: n || 0, tip: kind === "monster" ? "survive_mon" : "survive_item" };
  }
  if (SEC === "popularity") return { value: row.pick_rate, n: row.offered || 0, tip: "popularity" };
  return { value: row.claim_rate, n: row.held_win || 0, tip: "keep" };
}

function sortRows(rows, kind) {
  const copy = rows.slice();
  copy.sort((a, b) => {
    const am = metric(a, kind).value;
    const bm = metric(b, kind).value;
    if (am == null && bm == null) return 0;
    if (am == null) return 1;
    if (bm == null) return -1;
    if (SEC === "popularity") return bm - am;
    return am - bm;
  });
  return copy;
}

function barRow(row, kind, m, spread) {
  const met = metric(row, kind);
  const el = document.createElement("div");
  el.className = "row";
  const src = ART[row.id];
  if (src) {
    const img = document.createElement("img");
    img.src = src;
    img.alt = row.id;
    el.appendChild(img);
  } else {
    const ph = document.createElement("div");
    ph.className = "ph";
    ph.textContent = row.id;
    el.appendChild(ph);
  }
  const track = document.createElement("div");
  track.className = "track";
  const fill = document.createElement("div");
  fill.className = "fill";
  const v = met.value == null ? 0 : Math.max(0, Math.min(100, met.value));
  fill.style.width = v + "%";
  fill.style.background = heatColor(met.value, m, spread, met.n >= N_MIN);
  track.appendChild(fill);
  if (m != null && !Number.isNaN(m)) {
    const mark = document.createElement("div");
    mark.className = "mean";
    mark.style.left = Math.max(0, Math.min(100, m)) + "%";
    track.appendChild(mark);
  }
  el.appendChild(track);
  const pct = document.createElement("div");
  pct.className = "pct";
  pct.textContent = fmt(met.value);
  el.appendChild(pct);
  el.addEventListener("pointerenter", (ev) => {
    $("tip").innerHTML = TIPS[met.tip](row, met.value);
    $("tip").style.display = "block";
    moveTip(ev);
  });
  el.addEventListener("pointermove", moveTip);
  el.addEventListener("pointerleave", () => { $("tip").style.display = "none"; });
  return el;
}

function moveTip(ev) {
  const t = $("tip");
  t.style.left = Math.min(ev.clientX + 14, window.innerWidth - 280) + "px";
  t.style.top = Math.min(ev.clientY + 14, window.innerHeight - 120) + "px";
}

function band(title, rows, kind) {
  const wrap = document.createElement("div");
  const lab = document.createElement("div");
  lab.className = "band";
  lab.textContent = title;
  wrap.appendChild(lab);
  const list = document.createElement("div");
  list.className = "rows";
  const usable = sortRows(rows, kind);
  const vals = usable.map((r) => metric(r, kind).value).filter((v) => v != null);
  const m = mean(vals);
  const spread = Math.max(12, sd(vals, m) * 1.25);
  usable.forEach((r) => list.appendChild(barRow(r, kind, m, spread)));
  wrap.appendChild(list);
  return wrap;
}

function draw() {
  const board = $("board");
  board.innerHTML = "";
  const items = DATA.items || [];
  const mons = DATA.monsters || [];
  for (const t of [1, 2, 3]) {
    const col = document.createElement("div");
    col.className = "col";
    const h = document.createElement("h2");
    h.textContent = TIER_NAME[t];
    h.title = "Only compared to other " + TIER_NAME[t] + " cards. Never mixed with the other columns.";
    col.appendChild(h);
    const it = items.filter((r) => Number(r.tier) === t);
    const mo = mons.filter((r) => Number(r.tier) === t);
    if (SEC === "survive") {
      col.appendChild(band("Items", it, "item"));
      col.appendChild(band("Monsters", mo, "monster"));
    } else {
      col.appendChild(band("Items", it, "item"));
    }
    board.appendChild(col);
  }
}

async function loadLive() {
  const url = $("url").value.trim().replace(/\/$/, "");
  const token = $("token").value.trim();
  localStorage.setItem("swipe_pt_url", url);
  localStorage.setItem("swipe_pt_token", token);
  $("status").textContent = "Loading…";
  try {
    const test = $("test").checked ? "&test=1" : "";
    const res = await fetch(url + "?view=telemetry" + test, {
      headers: { "X-Swipe-Playtest": token },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    DATA = data;
    draw();
    $("status").textContent = "Live. " + (data.counted || "");
  } catch (e) {
    $("status").textContent = "Could not load: " + e.message;
  }
}

function showExample() {
  DATA = EXAMPLE;
  draw();
  $("status").textContent = "Example. Invented bars. Gold dash is this column's average. Load live after an F5 campaign dungeon.";
}

setSec("survive");
showExample();
</script>
</body>
</html>
